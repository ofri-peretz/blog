name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm ci, not npm install: the lockfile is committed, so CI must install
      # exactly what it pins. npm install would silently resolve around a stale
      # lockfile and test a dependency set that never ships. --include=optional
      # keeps the platform-specific native bindings (@tailwindcss/oxide,
      # lightningcss, sharp) — every arch is in the lockfile, linux included.
      - run: npm ci --no-audit --no-fund --include=optional
      - run: npm run build
      - run: npm run test

  # ──────────────────────────────────────────────────────────────────────
  # Real-browser gate: the layout audit (overflow / overlap / tap targets /
  # contrast across the breakpoint matrix) and the journey audit (the
  # palette's keyboard contract, the copy receipt) against the PRODUCTION
  # build served by `next start`. Both scripts existed as manual tools;
  # the 43px mobile document-scroll (blog#193) lived on production
  # precisely because nothing ran them per-PR. Runner images ship Chrome;
  # playwright-core reuses it — nothing is downloaded.
  #
  # ROUTES excludes /npm and /scorecard: they are force-dynamic Supabase
  # pages whose fetchers THROW without credentials (by design — see
  # responsive-lock), and CI has none.
  # ──────────────────────────────────────────────────────────────────────
  browser-audit:
    runs-on: ubuntu-latest
    # A hung `next start` or stalled navigation must not block every
    # subsequent PR (review). 25, not 15: the observed matrix alone runs
    # ~10 min and the full job ~16-18 — tune down once a p95 exists.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund --include=optional
      - run: npm run build
      - name: Serve the production build
        run: |
          (cd apps/blog && npx next start -p 3000 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000 >/dev/null && exit 0; sleep 1
          done
          echo "server never came up"; exit 1
      # NO `ROUTES` override. It used to pin seven routes while the script's
      # own default covers nine — the two extras being `/npm` and
      # `/scorecard`. deploy.yml runs the SAME script with no override, so the
      # PR gate was enforcing a strictly smaller matrix than the deploy gate,
      # and the first place anyone learned about a /scorecard regression was a
      # failed production deploy. That is exactly what happened on 2026-09-02:
      # CI green, deploy red on `/scorecard @320 @200% text`.
      #
      # A gate that checks less than the gate after it is not a gate, it is a
      # delay. Let the script own the route list so both read the same one.
      - name: Layout audit (overflow, overlap, tap targets, contrast)
        run: node apps/blog/scripts/layout-audit.mjs
        env:
          BASE: http://localhost:3000
      - name: Journey audit (palette keyboard contract, copy receipt)
        run: node apps/blog/scripts/journey-audit.mjs
        env:
          BASE: http://localhost:3000

  # ──────────────────────────────────────────────────────────────────────
  # Dual linter — eslint and oxlint run as TWO PARALLEL jobs (no `needs`
  # between them, neither blocks the other). Each is scoped to the
  # turbo-affected workspaces via `--affected`, which needs full git history
  # (fetch-depth: 0) to compute the diff against the base ref.
  # ──────────────────────────────────────────────────────────────────────
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund --include=optional
      - run: npx turbo run lint:eslint --affected
        env:
          # turbo --affected intermittently fails to resolve the base ref
          # ('fatal: ambiguous argument main') on PR checkouts. Pin the diff
          # base to the PR base SHA (present with fetch-depth: 0); empty on
          # push, where turbo falls back to its default.
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}

  oxlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund --include=optional
      - run: npx turbo run lint:oxlint --affected
        env:
          # turbo --affected intermittently fails to resolve the base ref
          # ('fatal: ambiguous argument main') on PR checkouts. Pin the diff
          # base to the PR base SHA (present with fetch-depth: 0); empty on
          # push, where turbo falls back to its default.
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
