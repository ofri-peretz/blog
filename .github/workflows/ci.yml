name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # No npm cache / npm ci: the lockfile is intentionally uncommitted
      # (exact versions pinned via .npmrc) to avoid cross-platform native-binding
      # breaks (@tailwindcss/oxide). Install fresh on linux.
      - run: npm install --no-audit --no-fund --include=optional
      - run: npm run build
      - run: npm run test

  # ──────────────────────────────────────────────────────────────────────
  # Dual linter — eslint and oxlint run as TWO PARALLEL jobs (no `needs`
  # between them, neither blocks the other). Each is scoped to the
  # turbo-affected workspaces via `--affected`, which needs full git history
  # (fetch-depth: 0) to compute the diff against the base ref.
  # ──────────────────────────────────────────────────────────────────────
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund --include=optional
      - run: npx turbo run lint:eslint --affected

  oxlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund --include=optional
      - run: npx turbo run lint:oxlint --affected
