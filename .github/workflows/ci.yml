name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm ci, not npm install: the lockfile is committed, so CI must install
      # exactly what it pins. npm install would silently resolve around a stale
      # lockfile and test a dependency set that never ships. --include=optional
      # keeps the platform-specific native bindings (@tailwindcss/oxide,
      # lightningcss, sharp) — every arch is in the lockfile, linux included.
      - run: npm ci --no-audit --no-fund --include=optional
      - run: npm run build
      - run: npm run test

  # ──────────────────────────────────────────────────────────────────────
  # Dual linter — eslint and oxlint run as TWO PARALLEL jobs (no `needs`
  # between them, neither blocks the other). Each is scoped to the
  # turbo-affected workspaces via `--affected`, which needs full git history
  # (fetch-depth: 0) to compute the diff against the base ref.
  # ──────────────────────────────────────────────────────────────────────
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund --include=optional
      - run: npx turbo run lint:eslint --affected
        env:
          # turbo --affected intermittently fails to resolve the base ref
          # ('fatal: ambiguous argument main') on PR checkouts. Pin the diff
          # base to the PR base SHA (present with fetch-depth: 0); empty on
          # push, where turbo falls back to its default.
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}

  oxlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund --include=optional
      - run: npx turbo run lint:oxlint --affected
        env:
          # turbo --affected intermittently fails to resolve the base ref
          # ('fatal: ambiguous argument main') on PR checkouts. Pin the diff
          # base to the PR base SHA (present with fetch-depth: 0); empty on
          # push, where turbo falls back to its default.
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
