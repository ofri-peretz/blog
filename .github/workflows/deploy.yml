name: Deploy production

# Build + deploy entirely on GitHub Actions (free/unlimited on public repos),
# so we never spend Vercel build minutes or preview-deploy quota. Vercel only
# receives the *prebuilt* output. With `github.enabled: false` in vercel.json,
# Vercel's GitHub app no longer auto-builds, previews, or posts PR statuses —
# this workflow is the sole production-deploy path.
#
# Gated: the deploy steps run only after build + test + lint pass, so a broken
# visualization or missing artifact fails CI before anything ships.
#
# Required secrets: VERCEL_ORG_ID, VERCEL_PROJECT_ID (repo-level) and
# VERCEL_TOKEN (scoped to the `production` GitHub environment, so no other
# job or workflow can read it).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Cap the job so a wedged `vercel build`/upload fails fast instead of
    # hanging up to GitHub's 6h default (observed a ~25min stall before a
    # production auth error surfaced).
    timeout-minutes: 35
    environment:
      name: production
      url: https://ofriperetz.dev
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund --include=optional

      # ── Gates (must pass before deploy) ──────────────────────────────
      # Same order as ci.yml: build first, so a compile error surfaces as a
      # named Build failure instead of later inside `vercel build`.
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test
      - name: Lint (eslint + oxlint)
        run: npm run lint

      # ── Build on GHA, deploy prebuilt output to Vercel production ─────
      # Pinned: a fresh `vercel@latest` resolve on every deploy would let a
      # breaking or compromised release silently change deploy behavior.
      # This is the only workflow that installs the Vercel CLI.
      - name: Install Vercel CLI
        run: npm i -g vercel@54.20.1
      # Run the Vercel CLI from the repo root: the project's Root Directory
      # setting is apps/blog and the CLI resolves it relative to the CWD, so
      # running inside apps/blog doubled the path (apps/blog/apps/blog).
      # --token is passed explicitly on every call — the CLI does not read a
      # VERCEL_TOKEN env var.
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build + deploy prebuilt to production
        # Explicit promote (2026-07-19): production deployments were completing
        # Ready WITHOUT taking ofriperetz.dev — an opaque promotion pin that
        # survived autoAssignCustomDomains=true and lastRollbackTarget=null
        # (see agents/footprint/incident-ledger.md, "production apex was
        # PINNED"). Waiting for Ready and promoting explicitly makes
        # main -> apex deterministic regardless of platform pin state.
        #
        # Hardened 2026-07-26 after NINE consecutive failed deploys. The logs
        # are unambiguous: build + deploy finish in ~50s and report Ready, then
        # `vercel promote` emits nothing at all and hangs until the job-level
        # timeout kills it 32 minutes later. The apex kept serving a 6-day-old
        # deployment while every run "succeeded" up to that point.
        #
        # So: bound the promote, fall back to `alias set` (a different API path
        # that assigns the domain directly and does not wait on the promotion
        # pin), and then VERIFY the apex actually moved instead of trusting an
        # exit code. A deploy that cannot take the domain must fail loudly.
        run: |
          set -euo pipefail
          NEXT_PUBLIC_SITE_URL=https://ofriperetz.dev vercel build --prod --token="$VERCEL_TOKEN"

          # `vercel deploy` is the actual hang (run 30185203623):
          #   02:54:32  Deployment completed
          #   02:54:34  Running Checks…      <- blocks here
          #   03:26:06  ##[error]The operation was canceled.
          # The upload and build finish in ~100s, then the CLI waits on Vercel
          # Deployment Checks and never returns, so nothing after this line ever
          # ran. --skip-domain makes deploy return the URL as soon as the
          # deployment exists; we assign the domain ourselves below, which is
          # what we wanted anyway given the apex pin. timeout is a second belt.
          URL=$(timeout 600 vercel deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN" | tail -1)
          echo "deployed: $URL"
          [ -n "$URL" ] || { echo "::error::vercel deploy returned no URL"; exit 1; }

          # 1) Preferred path, but never allowed to hang the job.
          if timeout 180 vercel promote "$URL" --yes --token="$VERCEL_TOKEN"; then
            echo "promote: ok"
          else
            echo "promote: timed out or failed — falling back to alias set"
            timeout 180 vercel alias set "$URL" "$APEX" --token="$VERCEL_TOKEN" \
              || echo "alias set: also failed; verification below decides the job"
          fi

          # 2) Trust nothing — confirm the apex is really serving THIS build.
          #    Compare the deployment's own build id against the apex's: if the
          #    apex still points at the previous deployment they differ, which
          #    catches a silent no-op promote without depending on any one file.
          echo "verifying apex…"
          want=$(curl -s "$URL/_next/BUILD_ID" -A 'gha-deploy-verify' || true)
          echo "expected build id: ${want:-<unavailable>}"
          ok=0
          for i in $(seq 1 20); do
            got=$(curl -s "https://$APEX/_next/BUILD_ID" -A 'gha-deploy-verify' || true)
            if [ -n "$want" ] && [ "$got" = "$want" ]; then ok=1; break; fi
            # Fallback when BUILD_ID is not exposed: just require the apex to be up.
            if [ -z "$want" ] && [ "$(curl -s -o /dev/null -w '%{http_code}' "https://$APEX/")" = "200" ]; then
              echo "BUILD_ID unavailable — falling back to a liveness check only"; ok=1; break
            fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Deployment $URL is Ready but $APEX is NOT serving it."
            echo "::error::The production apex is pinned. Clear the pin in the Vercel"
            echo "::error::dashboard (Project → Deployments → promote manually), then re-run."
            exit 1
          fi
          echo "apex verified: https://$APEX is serving $URL"
        env:
          APEX: ofriperetz.dev
