<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Interlace">
  <!-- The mark, byte-identical in geometry to render-cover.sh, which is what all
       78 article covers carry. Two interlocking bars at -30deg: burnt orange over
       bottle green. Angular, never organic — that shape is the brand asset. -->
  <g transform="rotate(-30 50 50)">
    <rect x="11" y="28" width="58" height="20" rx="10" fill="#f4794a"/>
    <rect x="31" y="52" width="58" height="20" rx="10" fill="#0d9460"/>
  </g>
</svg>
